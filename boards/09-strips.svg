<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="940" fill="#f6f1e6"/>
<text x="48" y="70" font-size="36" fill="#9c4221" font-weight="700">Fraction strips</text>
<text x="48" y="115" font-size="24" fill="#5c5146">A longer piece is the greater unit fraction.</text>
<rect x="48" y="160" width="760" height="64" rx="6" fill="#c9d7c4" stroke="#241c14"/>
<text x="64" y="202" font-size="26">1 whole</text>
<rect x="48" y="260" width="380" height="64" rx="6" fill="#f3d48a" stroke="#241c14"/>
<text x="64" y="302" font-size="26">1/2</text>
<rect x="48" y="360" width="253" height="64" rx="6" fill="#f0b7a8" stroke="#241c14"/>
<text x="64" y="402" font-size="26">1/3</text>
<rect x="48" y="460" width="190" height="64" rx="6" fill="#b9c9ea" stroke="#241c14"/>
<text x="64" y="502" font-size="26">1/4</text>
<rect x="48" y="560" width="152" height="64" rx="6" fill="#e3c6ef" stroke="#241c14"/>
<text x="64" y="602" font-size="26">1/5</text>
<text x="48" y="720" font-size="34">1/2 &gt; 1/4</text>
<text x="48" y="790" font-size="34">1/5 &lt; 1/3</text>
<text x="48" y="860" font-size="34">1/4 &lt; 1/3</text>
</svg>
