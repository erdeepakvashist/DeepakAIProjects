<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="900" fill="#f6f1e6"/>

<text x="48" y="70" font-size="36" fill="#9c4221" font-weight="700">Types of fractions</text>
<g font-family="Georgia, serif">
<rect x="48" y="110" width="380" height="160" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="72" y="155" font-size="24" fill="#9c4221" font-weight="700">Unit</text>
<text x="72" y="200" font-size="28">numerator is 1</text>
<text x="72" y="240" font-size="26" fill="#5c5146">1/2    1/4    1/10</text>
<rect x="470" y="110" width="380" height="160" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="494" y="155" font-size="24" fill="#9c4221" font-weight="700">Proper</text>
<text x="494" y="200" font-size="28">top smaller than bottom</text>
<text x="494" y="240" font-size="26" fill="#5c5146">2/4    3/10    6/9</text>
<rect x="48" y="300" width="380" height="160" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="72" y="345" font-size="24" fill="#9c4221" font-weight="700">Improper</text>
<text x="72" y="390" font-size="28">top greater or equal</text>
<text x="72" y="430" font-size="26" fill="#5c5146">7/4    15/9    9/9</text>
<rect x="470" y="300" width="380" height="160" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="494" y="345" font-size="24" fill="#9c4221" font-weight="700">Mixed</text>
<text x="494" y="390" font-size="28">whole number + fraction</text>
<text x="494" y="430" font-size="26" fill="#5c5146">5 and 1/2</text>
<rect x="48" y="490" width="380" height="170" rx="14" fill="#e7f3ea" stroke="#b7dcc6"/>
<text x="72" y="540" font-size="24" fill="#1f6b43" font-weight="700">Like</text>
<text x="72" y="590" font-size="28">same denominator</text>
<text x="72" y="630" font-size="26">1/4 ,  2/4 ,  3/4</text>
<rect x="470" y="490" width="380" height="170" rx="14" fill="#f8e8e4" stroke="#efc7c0"/>
<text x="494" y="540" font-size="24" fill="#8d3428" font-weight="700">Unlike</text>
<text x="494" y="590" font-size="28">different denominators</text>
<text x="494" y="630" font-size="26">1/2 ,  3/4 ,  2/6</text>
</g>
<text x="48" y="760" font-size="28" fill="#241c14">7/4 is improper, because 7 is greater than 4.</text>
<text x="48" y="820" font-size="28" fill="#241c14">1/10 is a unit fraction and a proper fraction.</text>

</svg>
