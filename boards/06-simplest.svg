<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="1020" fill="#f6f1e6"/>

<text x="48" y="70" font-size="36" fill="#9c4221" font-weight="700">Simplest form</text>
<text x="48" y="130" font-size="26" fill="#5c5146">Keep dividing by a common factor until only 1 is shared.</text>
<rect x="48" y="180" width="804" height="120" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="80" y="255" font-size="40">24/30</text>
<text x="280" y="255" font-size="28" fill="#5c5146">divide by 2</text>
<text x="520" y="255" font-size="40">12/15</text>
<rect x="48" y="340" width="804" height="120" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="80" y="415" font-size="40">12/15</text>
<text x="280" y="415" font-size="28" fill="#5c5146">divide by 3</text>
<text x="520" y="415" font-size="40" fill="#1f6b43">4/5</text>
<text x="48" y="540" font-size="28">4 and 5 share no factor except 1.</text>
<text x="48" y="600" font-size="32" fill="#1f6b43" font-weight="700">24/30 = 4/5</text>
<text x="48" y="700" font-size="30">More practice</text>
<text x="48" y="770" font-size="30">18/30 = 3/5</text>
<text x="48" y="830" font-size="30">14/28 = 1/2</text>
<text x="48" y="890" font-size="30">15/60 = 1/4</text>
<text x="48" y="950" font-size="30">10/25 = 2/5</text>

</svg>
