<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="800" fill="#f6f1e6"/>

<text x="48" y="70" font-size="34" fill="#9c4221" font-weight="700">Comparing fractions</text>
<text x="48" y="130" font-size="26">Like fractions: same denominator, bigger numerator wins.</text>
<rect x="80" y="180" width="460" height="36" fill="#245f86"/>
<text x="560" y="208" font-size="28">4/7</text>
<rect x="80" y="240" width="115" height="36" fill="#9c4221"/>
<text x="220" y="268" font-size="28">1/7</text>
<text x="48" y="340" font-size="32">4/7  &gt;  1/7</text>
<text x="48" y="400" font-size="32">5/18  &lt;  9/18</text>
<text x="48" y="480" font-size="26">Unit fractions: bigger denominator, smaller piece.</text>
<rect x="80" y="520" width="500" height="50" fill="#2f6b45"/>
<text x="600" y="555" font-size="28">1/2</text>
<rect x="80" y="600" width="110" height="50" fill="#8fbf7a"/>
<text x="210" y="635" font-size="28">1/9</text>
<text x="48" y="720" font-size="36" fill="#1f6b43" font-weight="700">1/2  &gt;  1/9</text>

</svg>
