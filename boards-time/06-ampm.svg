<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="900" fill="#f6f1e6"/>

<text x="48" y="64" font-size="34" fill="#9c4221" font-weight="700">a.m. and p.m.</text>
<text x="70" y="150" font-size="22">12 midnight</text>
<text x="390" y="150" font-size="22">12 noon</text>
<text x="720" y="150" font-size="22">12 midnight</text>
<line x1="80" y1="190" x2="820" y2="190" stroke="#9c4221" stroke-width="4"/>
<circle cx="80" cy="190" r="8" fill="#245f86"/>
<circle cx="450" cy="190" r="8" fill="#e09a3e"/>
<circle cx="820" cy="190" r="8" fill="#245f86"/>
<text x="48" y="270" font-size="26">a.m. means before noon: midnight to noon.</text>
<text x="48" y="320" font-size="26">p.m. means after noon: noon to midnight.</text>
<text x="48" y="400" font-size="28">Morning class: 8:00 a.m.</text>
<text x="48" y="460" font-size="28">Evening class: 8:00 p.m.</text>
<rect x="48" y="520" width="804" height="150" rx="14" fill="#fffaf3" stroke="#e2d5c3"/>
<text x="72" y="580" font-size="26">12 o'clock is 12 noon or 12 midnight.</text>
<text x="72" y="630" font-size="26">Do not write a.m. or p.m. after 12.</text>
<text x="48" y="760" font-size="26">School gates 7:50 a.m. Prayer 7:57 a.m.</text>
<text x="48" y="820" font-size="26">A student after 7:57 a.m. is late.</text>

</svg>