<text x="260" y="532" text-anchor="middle" font-size="24" font-family="Georgia, serif" fill="#241c14">4:48</text>
<text x="500" y="260" font-size="26">Hour hand has passed 4,</text>
<text x="500" y="310" font-size="26">not yet 5.</text>
<text x="500" y="380" font-size="26">9 means 45 minutes.</text>
<text x="500" y="430" font-size="26">Then 46, 47, 48.</text>
<text x="48" y="620" font-size="30">4:48 is 48 minutes past 4.</text>
<text x="48" y="690" font-size="30">It is also 12 minutes to 5.</text>
<text x="48" y="780" font-size="26" fill="#5c5146">60 − 48 = 12 minutes left until 5.</text>
<text x="48" y="880" font-size="28">3 minutes to 7 is 6:57.</text>
<text x="48" y="940" font-size="28">18 minutes to 3 is 2:42.</text>

