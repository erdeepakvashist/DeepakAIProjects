<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" font-family="Georgia, 'Times New Roman', serif">
<rect width="900" height="940" fill="#f6f1e6"/>

<text x="48" y="64" font-size="34" fill="#9c4221" font-weight="700">To the exact minute</text>
<text x="48" y="120" font-size="24">Each number is 5 minutes. Each small mark is 1 minute.</text>
<circle cx="250" cy="380" r="160" fill="#f6d56b" stroke="#241c14" stroke-width="4"/>
<text x="316.0" y="271.7" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">1</text>
<text x="364.3" y="320.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">2</text>
<text x="382.0" y="386.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">3</text>
<text x="364.3" y="452.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">4</text>
<text x="316.0" y="500.3" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">5</text>
<text x="250.0" y="518.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">6</text>
<text x="184.0" y="500.3" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">7</text>
<text x="135.7" y="452.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">8</text>
<text x="118.0" y="386.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">9</text>
<text x="135.7" y="320.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">10</text>
<text x="184.0" y="271.7" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">11</text>
<text x="250.0" y="254.0" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#241c14">12</text>
<line x1="250" y1="380" x2="200.2" y2="442.6" stroke="#241c14" stroke-width="7" stroke-linecap="round"/>
<line x1="250" y1="380" x2="365.8" y2="404.6" stroke="#9c4221" stroke-width="4" stroke-linecap="round"/>
<circle cx="250" cy="380" r="6" fill="#241c14"/>
<text x="250" y="582" text-anchor="middle" font-size="24" font-family="Georgia, serif" fill="#241c14">7:17</text>
<text x="500" y="280" font-size="26">Hour hand has passed 7,</text>
<text x="500" y="320" font-size="26">not yet 8.</text>
<text x="500" y="390" font-size="26">From 12: 5, 10, 15.</text>
<text x="500" y="440" font-size="26">Then two more marks:</text>
<text x="500" y="490" font-size="26">16, 17.</text>
<text x="48" y="680" font-size="30" fill="#1f6b43" font-weight="700">7:17 is 17 minutes past 7.</text>
<text x="48" y="760" font-size="26">There are 60 small divisions on a clock.</text>
<text x="48" y="810" font-size="26">The minute hand moves from one number</text>
<text x="48" y="860" font-size="26">to the next in 5 minutes.</text>

</svg>