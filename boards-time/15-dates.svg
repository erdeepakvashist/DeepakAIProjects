<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="Georgia, serif">
<rect width="900" height="780" fill="#f6f1e6"/>
<text x="48" y="58" font-size="32" fill="#9c4221" font-weight="700">Writing dates</text>
<text x="48" y="120" font-size="26">A date has a day, a month, and a year.</text>
<text x="48" y="180" font-size="26">In words: 15th August 2025</text>
<text x="48" y="250" font-size="26">In India we write DD/MM/YYYY.</text>
<text x="48" y="310" font-size="30">15/08/2025</text>
<text x="48" y="380" font-size="26">In the United States the order is MM/DD/YYYY.</text>
<text x="48" y="440" font-size="30">08/15/2025</text>
<text x="48" y="520" font-size="26">15/08/2024 is 15 August, not 8 August.</text>
<text x="48" y="580" font-size="26">18/04/2024 is 18 April, not 4 April.</text>
<text x="48" y="640" font-size="26">25/01/2025 is 25 January 2025.</text>
<text x="48" y="700" font-size="26">25/12/2023 is 25 December 2023.</text>
</svg>