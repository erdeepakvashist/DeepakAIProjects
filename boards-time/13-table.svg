<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Georgia, serif">
<rect width="900" height="760" fill="#f6f1e6"/>
<text x="48" y="58" font-size="32" fill="#9c4221" font-weight="700">Complete each time</text>
<text x="48" y="120" font-size="24" fill="#5c5146">Each given time stands on its own. Fill the missing words and clocks.</text>
<text x="48" y="190" font-size="26">17:00 hours = 5:00 p.m.</text>
<text x="48" y="235" font-size="24" fill="#5c5146">5 o'clock in the evening</text>
<text x="48" y="300" font-size="26">6 o'clock in the morning = 06:00 hours</text>
<text x="48" y="345" font-size="24" fill="#5c5146">6:00 a.m.</text>
<text x="48" y="410" font-size="26">11:00 a.m. = 11:00 hours</text>
<text x="48" y="455" font-size="24" fill="#5c5146">11 o'clock in the morning</text>
<text x="48" y="520" font-size="26">9 o'clock in the morning = 09:00 hours</text>
<text x="48" y="565" font-size="24" fill="#5c5146">9:00 a.m.</text>
<text x="48" y="630" font-size="26">3:20 a.m. = 03:20 hours</text>
<text x="48" y="675" font-size="24" fill="#5c5146">3:20 in the morning</text>
</svg>